# Network-VNO-AI 配置文件 / profiles.conf
# 业务场景优化方案（任务书 11 章）
# 说明：业务场景只作为计算输入，不能替代实际测量

[default]
description=通用服务器优化
level=2
priority=stable

[website]
description=普通网站服务器（优先稳定连接、合理缓冲区、避免队列延迟）
level=2
priority=stable

[proxy_tunnel]
description=代理和隧道服务器（优先长连接稳定性、高RTT连接、双向吞吐量、合理TCP缓冲区、CPU转发负载、网络中断分布）
level=2
priority=throughput

[high_bandwidth]
description=高带宽下载服务器（优先BDP、多流吞吐量、Receive Buffer、Send Buffer、队列调度、CPU网络处理能力）
level=2_or_3
priority=throughput

[high_concurrent]
description=高并发API服务器（优先TCP连接建立效率、连接队列、Listen Overflow、连接资源、内存预算、CPU调度）
level=2
priority=connection

[low_latency]
description=低延迟服务器（优先RTT、Bufferbloat、队列管理、抖动、丢包、延迟敏感型调度）
level=2
priority=latency

[high_rtt_cross_region]
description=高RTT跨地域服务器（优先BDP、TCP自动窗口调节、缓冲区预算、单流和多流吞吐量、丢包恢复能力）
level=2_or_3
priority=throughput
