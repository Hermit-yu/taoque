# Network-VNO-AI 配置文件 / thresholds.conf
# 阈值参考：用于判断数据可信度和优化建议的边界条件（任务书 10.5 数据可信度要求）

[trust_level]
high=多轮实测+可靠RTT+完整带宽数据
medium=可靠硬件信息+多轮网络检测但缺少真实带宽数据
low=带宽未知或目标不可达或数据不完整
rule=数据不足时必须保守推荐，不可编造缺失数据

[buffer_warning]
small_memory_threshold_mb=512
medium_memory_threshold_mb=2048
large_memory_threshold_mb=8192
rule=缓冲区上限不能简单乘以连接数量作为实际内存消耗

[bbr_module_check]
require_loaded=true
require_check_file=/proc/sys/net/ipv4/tcp_available_congestion_control
note=不允许仅根据内核版本推断BBR可用，必须检查实际注册状态

[interface_check]
require_real_physical_for_high_perf=true
virtual_interface_note=虚拟网卡标称速率不能当作真实公网带宽

# 需求 2（已追加）：不要把 BBRv3 当成万能方案 → 先检测能力，再决定是否推荐
# 各技术适用条件（根据内核版本、虚拟化环境、网卡驱动实际支持情况判断）：
# BBR：需内核 >= 4.9 且 bbr 模块已加载（bbr 模块存在），但在虚拟化环境中可能受限（KVM 的网络堆栈隔离）
# CUBIC：Linux 默认，几乎所有环境支持，稳定性高，优先推荐
# FQ（Fair Queue）：需内核支持 + 网卡驱动支持硬件卸载（ethtool -k 验证）
# CAKE：需内核 >= 4.19 + 复杂 qdisc 配置，适合高带宽低延迟场景，不适合虚拟化或小内存
# 规则：检测到内核模块已加载 + 当前拥塞控制可运行 = 才推荐对应优化；否则保持当前状态

[congestion_capability_check]
BBR_CONDITION=内核版本>=4.9 且 bbr 模块已加载 且非受限虚拟化环境
CUBIC_CONDITION=Linux 默认，全部环境支持，稳定可靠（本任务已验证 CUBIC 正常工作）
FQ_CONDITION=网卡支持硬件卸载（ethtool -k 检查）且内核支持 FQ 模块
CAKE_CONDITION=内核>=4.19 且高带宽场景 且非资源受限虚拟化
rule=不强制安装新内核来追求最新技术；检测能力后再决定是否推荐
